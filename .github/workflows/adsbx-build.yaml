name: Notify Builder

on:
  push:
    branches: [ dev, master, "**" ]
    tags: [ 'v*.*.*' ] # semantic releases only

permissions:
  contents: read

concurrency:
  group: dispatch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger builder
        env:
          GH_OWNER: ${{ secrets.DISPATCH_OWNER }}
          GH_REPO: ${{ secrets.DISPATCH_REPO }}
          GH_EVENT: ${{ secrets.DISPATCH_EVENT }}
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          REF_NAME="${GITHUB_REF_NAME}"
          REF_TYPE="${GITHUB_REF_TYPE}"
          SHA="${GITHUB_SHA}"
          SRC_REPO="${{ github.repository }}"

          PAYLOAD=$(jq -nc --arg ref "$REF_NAME" \
                            --arg type "$REF_TYPE" \
                            --arg sha "$SHA" \
                            --arg src "$SRC_REPO" \
                            '{ref:$ref, ref_type:$type, sha:$sha, source_repo:$src}')

          curl -sS -f -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/dispatches" \
            -d "$(jq -nc --arg et "$GH_EVENT" --argjson pl "$PAYLOAD" '{event_type:$et, client_payload:$pl}')"

          echo "Dispatched to builder."