name: test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libzstd-dev zlib1g-dev libncurses-dev

    - name: Build readsb
      run: make -j$(nproc)

    - name: Run unit tests
      run: make test

    - name: Run integration tests
      run: make inttest
